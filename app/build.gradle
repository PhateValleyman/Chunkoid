plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

def levelDbJar = file('libs/leveldb-1.1.0.jar')
def filteredLevelDbJar = tasks.register('filterLevelDbJar', Zip) {
	group = 'build'
	description = 'Exclude the ZLib class already provided by the app source.'
	archiveFileName.set('leveldb-1.1.0-filtered.jar')
	destinationDirectory.set(layout.buildDirectory.dir('generated/leveldb'))
	from(zipTree(levelDbJar)) {
		exclude 'org/iq80/leveldb/util/ZLib.class'
	}
	doFirst {
		if (!levelDbJar.isFile()) {
			throw new GradleException("Required local LevelDB dependency is missing: ${levelDbJar}")
		}
	}
}

android {
    namespace 'com.encore.chunkoid'
    compileSdk 34

    defaultConfig {
        applicationId "com.encore.chunkoid"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "2.1.0-B"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    aaptOptions {
        noCompress 'jar'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    implementation 'androidx.preference:preference-ktx:1.2.1'

    implementation 'androidx.palette:palette-ktx:1.0.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation project(':nbt')

    implementation 'com.hivemc.leveldb:leveldb-api:1.1.0'
	implementation files(filteredLevelDbJar.flatMap { it.archiveFile })

    implementation 'com.google.guava:guava:33.3.1-android'
}
