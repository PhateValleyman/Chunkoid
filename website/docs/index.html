    <script src="marked.js"></script>
    <script>
        const docs = [
            { id: 'chunkoid', title: '1. 软件概述', file: 'chunkoid.md' },
            { id: 'instructions', title: '1.1 软件操作手册', file: 'Instructions.md' },
            { id: 'faq', title: '1.2 疑难解答手册', file: 'FAQ.md' },
            { id: 'privacy', title: '2. 隐私政策', file: 'Privacy.md' },
            { id: 'terms', title: '3. 服务条款', file: 'Terms.md' }
        ];

        let currentIndex = 0;

        function renderToc() {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = docs.map((doc, index) => `
                <li>
                    <a href="#${doc.id}" onclick="loadDoc(${index}); return false;" 
                       class="${index === currentIndex ? 'active' : ''}">
                        ${doc.title}
                    </a>
                </li>
            `).join('');
        }

        async function loadDoc(index, updateHistory = true) {
            if (index < 0 || index >= docs.length) return;
            
            currentIndex = index;
            const doc = docs[index];
            const contentContainer = document.getElementById('docContent');
            const mainContainer = document.getElementById('docMainContent');
            
            if (updateHistory) {
                history.replaceState(null, '', '#' + doc.id);
            }
            
            mainContainer.style.opacity = '0.5';
            document.getElementById('docTitle').textContent = doc.title;
            
            try {
                const response = await fetch(doc.file);
                if (!response.ok) throw new Error('Network error');
                const markdown = await response.text();
                const html = marked(markdown);
                contentContainer.innerHTML = html;
                
                // 增强文档图片性能
                const images = contentContainer.querySelectorAll('img');
                images.forEach(img => {
                    img.setAttribute('loading', 'lazy');
                    img.setAttribute('decoding', 'async');
                });
            } catch (error) {
                contentContainer.innerHTML = '<p class="md-p" style="color: #fbbf24;">文档加载失败。如果您正在本地通过双击 HTML 文件浏览，请通过本地 Web 服务器（如 VS Code Live Server 或 HTTP 服务）访问以支持 Markdown 异步加载。</p>';
            } finally {
                mainContainer.style.opacity = '1';
            }
            
            renderToc();
            updatePagination();
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updatePagination() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const pageInfo = document.getElementById('pageInfo');
            
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === docs.length - 1;
            pageInfo.textContent = `${currentIndex + 1} / ${docs.length}`;
            
            prevBtn.onclick = () => loadDoc(currentIndex - 1);
            nextBtn.onclick = () => loadDoc(currentIndex + 1);
        }

        // 初始化 Hash 路由检测
        function initDoc() {
            const hash = window.location.hash.replace('#', '');
            const targetIndex = docs.findIndex(d => d.id === hash);
            if (targetIndex !== -1) {
                loadDoc(targetIndex, false);
            } else {
                loadDoc(0, false);
            }
        }

        renderToc();
        initDoc();

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '');
            const targetIndex = docs.findIndex(d => d.id === hash);
            if (targetIndex !== -1 && targetIndex !== currentIndex) {
                loadDoc(targetIndex, false);
            }
        });
    </script>
